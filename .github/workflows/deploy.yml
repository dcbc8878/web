name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "claude/dcbc-website-setup-1hs9tw"]
  workflow_dispatch:
  # Article pages are generated from Supabase at build time, so the site
  # has to redeploy on a timer for newly published articles to appear.
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an older deploy rather than queueing behind it.
# With cancel-in-progress: false, one run that stalls on GitHub's side --
# which happened, sitting in deployment_queued until it timed out -- leaves
# every later run queued behind it and then cancelled, so the site silently
# stops updating while every push still reports success locally. The site is
# static and every deploy publishes the whole tree, so losing a superseded
# run costs nothing: the newest content is what should be live.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Tailwind stylesheets
        run: |
          npx --yes tailwindcss@3 -c scripts/tailwind.site.js -i scripts/tailwind.site.in.css -o site.css --minify
          npx --yes tailwindcss@3 -c scripts/tailwind.cards.js -i scripts/tailwind.cards.in.css -o card.css --minify

      - name: Build article pages
        run: node scripts/build-articles.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

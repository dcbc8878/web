<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ไม่พบหน้าที่คุณต้องการ — DCBC</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --brand:#0f4c81; --ink:#0f1a24; --body:#45566a; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:"Noto Sans Thai",system-ui,sans-serif; min-height:100vh; display:grid; place-items:center; text-align:center; padding:24px; color:var(--body); background:linear-gradient(160deg,#f5f8fc,#e9f1fb); }
    .code { font-family:"Sora",sans-serif; font-size:clamp(4rem,18vw,9rem); font-weight:800; color:var(--brand); line-height:1; }
    h1 { font-family:"Sora","Noto Sans Thai",sans-serif; color:var(--ink); font-size:1.6rem; margin:8px 0 12px; }
    p { max-width:40ch; margin:0 auto 26px; }
    a { display:inline-flex; align-items:center; gap:8px; background:var(--brand); color:#fff; text-decoration:none; font-weight:600; padding:13px 26px; border-radius:999px; box-shadow:0 10px 30px -12px rgba(15,76,129,.4); transition:transform .15s; }
    a:hover { transform:translateY(-2px); }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>ไม่พบหน้าที่คุณต้องการ</h1>
    <p>ขออภัย หน้าที่คุณกำลังมองหาอาจถูกย้ายหรือไม่มีอยู่แล้ว</p>
    <a href="/">← กลับสู่หน้าแรก</a>
  </main>
</body>
</html>

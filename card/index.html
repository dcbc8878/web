<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover keeps content clear of the notch / home bar,
         since this page is opened almost entirely from a phone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="นามบัตรดิจิทัล บริษัท เด็กชายบัญชี จำกัด — รับทำบัญชี วางแผนภาษี จดทะเบียนบริษัท โทร 088-878-8648">
    <title>นามบัตร | เด็กชายบัญชี</title>
    <link rel="canonical" href="https://www.dcbc.co.th/card">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="theme-color" content="#FDF4E3">

    <meta property="og:type" content="profile">
    <meta property="og:title" content="บริษัท เด็กชายบัญชี จำกัด">
    <meta property="og:description" content="รับทำบัญชี วางแผนภาษี จดทะเบียนบริษัท">
    <meta property="og:url" content="https://www.dcbc.co.th/card">
    <meta property="og:image" content="https://www.dcbc.co.th/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --cream: #FDF4E3;
            --btn: #C9B3A6;
            --btn-press: #B79F91;
            --ink: #1A1A1A;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: 'Prompt', sans-serif;
            background: var(--cream);
            color: var(--ink);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            overflow-x: hidden;
        }

        .card {
            flex: 1;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 2.2rem 1.6rem 1rem;
            display: flex;
            flex-direction: column;
        }

        .brand {
            font-size: clamp(2.1rem, 11vw, 3rem);
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.01em;
            line-height: 1.25;
            margin-bottom: 0.5rem;
        }

        .tagline {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 300;
            color: #8a7d73;
            margin-bottom: 1.9rem;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Slab buttons matching the mock: full width, deeply rounded,
           tall enough to hit comfortably one-handed. */
        .slab {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            width: 100%;
            min-height: 5.1rem;
            padding: 0.9rem 1.2rem;
            background: var(--btn);
            color: #fff;
            border-radius: 1.15rem;
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.14s ease, background 0.14s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .slab:active { transform: scale(0.975); background: var(--btn-press); }
        .slab i { font-size: 1.2rem; }

        /* Footer sits as a row so the mascot anchors bottom-right without
           ever covering the company details on its left. */
        .bottom {
            margin-top: auto;
            padding-top: 1.25rem;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .footnote {
            font-size: 0.62rem;
            font-weight: 300;
            color: #a2958a;
            line-height: 1.7;
            padding-bottom: 0.2rem;
        }

        .mascot {
            width: 150px;
            max-width: 42vw;
            height: auto;
            display: block;
            flex-shrink: 0;
            margin-right: -0.5rem;
        }

        /* Shorter phones (iPhone SE and similar) would otherwise need
           scrolling. A business card should fit in one look, so the
           layout tightens rather than spilling over. */
        @media (max-height: 750px) {
            .card { padding-top: 1.3rem; }
            .brand { font-size: clamp(1.8rem, 9vw, 2.3rem); }
            .tagline { font-size: 0.72rem; margin-bottom: 1.1rem; }
            .actions { gap: 0.7rem; }
            .slab { min-height: 3.9rem; font-size: 0.97rem; border-radius: 1rem; }
            .bottom { padding-top: 0.6rem; }
            .mascot { width: 118px; }
            .footnote { font-size: 0.58rem; line-height: 1.6; }
        }

        @media (prefers-reduced-motion: reduce) {
            .slab { transition: none !important; }
        }
    </style>
</head>
<body>

    <main class="card">
        <h1 class="brand">เด็กชายบัญชี</h1>
        <p class="tagline">รับทำบัญชี · วางแผนภาษี · จดทะเบียนบริษัท</p>

        <div class="actions">
            <a href="tel:0888788648" class="slab">
                <i class="fa-solid fa-phone"></i> โทรหาเรา
            </a>

            <a href="https://line.me/R/ti/p/@dcbc" target="_blank" rel="noopener" class="slab">
                <i class="fa-brands fa-line"></i> เพิ่มเพื่อนใน LINE
            </a>

            <a href="https://www.facebook.com/profile.php?id=61576885766816" target="_blank" rel="noopener" class="slab">
                <i class="fa-brands fa-facebook-f"></i> ติดตามเพจ Facebook
            </a>

            <a href="/contact.vcf" download="dcbc-contact.vcf" class="slab">
                <i class="fa-solid fa-address-book"></i> บันทึกลงรายชื่อติดต่อ
            </a>
        </div>

        <div class="bottom">
            <p class="footnote">
                www.dcbc.co.th<br>
                contact@dcbc.co.th<br>
                เลขประจำตัวผู้เสียภาษีอากร<br>0555569000181
            </p>
            <img src="/mascot.png" alt="" aria-hidden="true" class="mascot">
        </div>
    </main>

</body>
</html>
